version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${STLC_PORT:-8000}:8000"
    environment:
      - STLC_SERVE_FRONTEND=true
      - STLC_AUTH_ENABLED=${STLC_AUTH_ENABLED:-false}
      - STLC_JWT_SECRET=${STLC_JWT_SECRET:?Set STLC_JWT_SECRET to a strong random secret}
      - STLC_ADMIN_USER=${STLC_ADMIN_USER:-admin}
      - STLC_ADMIN_PASSWORD=${STLC_ADMIN_PASSWORD:?Set STLC_ADMIN_PASSWORD}
      - STLC_API_KEYS=${STLC_API_KEYS:-}
      - STLC_LLM__BASE_URL=http://ollama:11434
      - STLC_CHROMADB__PERSIST_DIRECTORY=/data/chroma_db
    volumes:
      - chroma-data:/data/chroma_db
      - ./config:/app/config:ro
      - output-data:/app/output
    depends_on:
      ollama:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped
    # Uncomment for NVIDIA GPU support:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  chroma-data:
  ollama-models:
  output-data:
