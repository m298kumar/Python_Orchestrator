# Coverage Tracker Settings
# =========================
coverage:
  match_threshold: 0.5         # Minimum keyword overlap ratio for a TC to "cover" an AC
  weak_quality_threshold: 0.5  # Below this score, coverage is considered weak
  min_coverage_types: 1        # Minimum distinct test types (positive, negative, edge_case) per AC
