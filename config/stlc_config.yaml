project:
  name: My Application
  domain: FinTech
  tech_stack:
    platform: web
    frontend: ''
    backend: rest
    database: ''
    auth: ''
  platform: mobile
llm:
  provider: ollama
  model: qwen2.5:32b-instruct-q4_K_M
  base_url: http://10.0.0.211:11434
  temperature: 0.4
  num_ctx: 8192
  timeout: 450
  num_predict: 3200
  api_key: ''
chromadb:
  persist_directory: ./chroma_db
  collection_name: requirements
  embedding_backend: ollama
  ollama_embedding_model: qwen3-embedding:0.6b
  ollama_embedding_url: http://localhost:11434/api/embeddings
  sentence_transformer_model: all-MiniLM-L6-v2
test_generation:
  max_per_requirement: 6
  include_negative: true
  include_edge_cases: true
  format: gherkin
  ac_types:
    security:
      keywords:
      - password
      - auth
      - login
      - encrypt
      - token
      - credential
      - access control
      - permission
      - role
      - session
      - mfa
      - two-factor
      - oauth
      - ssl
      - tls
      - certificate
      - vulnerability
      - injection
      - xss
      - csrf
      - sanitize
    timing:
      keywords:
      - timeout
      - expire
      - deadline
      - schedule
      - interval
      - within * minutes
      - within * seconds
      - within * hours
      - before
      - after
      - duration
      - elapsed
      - countdown
      - real-time
      - delay
      - latency
      - ttl
    eligibility:
      keywords:
      - eligible
      - qualify
      - condition
      - criteria
      - require
      - must be
      - only if
      - prerequisite
      - minimum
      - maximum
      - at least
      - no more than
      - threshold
      - limit
    data_valid:
      keywords:
      - valid
      - invalid
      - format
      - length
      - range
      - pattern
      - regex
      - mandatory
      - optional
      - required field
      - alphanumeric
      - numeric
      - email
      - phone
      - date format
      - min length
      - max length
      - character
    ui_behaviour:
      keywords:
      - display
      - show
      - hide
      - enable
      - disable
      - visible
      - button
      - dropdown
      - modal
      - popup
      - tooltip
      - scroll
      - highlight
      - focus
      - hover
      - toggle
      - collapse
      - expand
      - placeholder
      - label
      - icon
      - color
      - font
    general:
      keywords: []
  domain_keywords:
    financial services:
    - cheque
    - banking
    - deposit
    - transaction
    - account
    - ledger
    - transfer
    - payment
    healthcare:
    - patient
    - clinical
    - ehr
    - prescription
    - pharmacy
    - diagnosis
    - medical
    - health
    retail e-commerce:
    - product
    - cart
    - checkout
    - inventory
    - catalogue
    - order
    - shipping
    insurance:
    - policy
    - claim
    - premium
    - underwriting
    education:
    - student
    - course
    - enrol
    - grade
    - curriculum
    - lms
    IT service management:
    - ticket
    - incident
    - asset
    - sla
    - helpdesk
    - itil
  sanitiser:
    min_desc_length: 15
    min_step_length: 10
    max_step_count: 20
    min_step_count: 1
  component_suffix_map:
    login: Login Screen
    register: Registration Screen
    dashboard: Dashboard
    settings: Settings Page
    profile: Profile Page
    search: Search Page
    checkout: Checkout Page
    cart: Shopping Cart
bdd:
  language: python
  framework: behave
  automation_lib: playwright
crawler:
  base_url: ''
  max_depth: 3
  max_pages: 100
  wait_for_network_idle: true
  respect_robots_txt: true
  rate_limit_ms: 1000
  auth:
    type: ''
    login_url: ''
    username: ''
    password: ''
api_testing:
  framework: pytest_requests
  openapi_spec: ''
  base_url: ''
export:
  output_dir: ./output
  formats:
  - csv
  - zephyr
  - json
  zephyr:
    project_key: PROJ
    folder_prefix: Generated Tests
    default_status: Draft
    default_labels: automated,generated
quality_gate:
  accept_threshold: 0.65
  regenerate_threshold: 0.4
  max_regeneration_attempts: 2
  auto_example_threshold: 0.8
  weights:
    coverage: 0.25
    clarity: 0.2
    executability: 0.2
    uniqueness: 0.15
    structural: 0.2
coverage:
  auto_fill_gaps: false
  weak_quality_threshold: 0.5
  min_coverage_types: 1
circuit_breaker:
  threshold: 3
  reset_timeout: 60.0
metrics:
  dir: output/metrics
  degradation_threshold_pct: 15.0
output:
  output_dir: ./output
  csv_filename: test_cases.csv
  zephyr_filename: zephyr_test_cases.csv
  report_filename: generation_report.json
