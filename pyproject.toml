[project]
name = "stlc-platform"
version = "0.1.0"
description = "AI-powered Software Testing Life Cycle automation platform"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["testing", "stlc", "test-generation", "bdd", "automation", "ai"]

dependencies = [
    # Core LLM & AI
    "ollama>=0.1.8",
    "chromadb>=0.5.3",

    # Web API
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "python-multipart>=0.0.6",

    # File Reading
    "python-docx>=1.1.0",
    "PyPDF2>=3.0.1",
    "openpyxl>=3.1.2",
    "pandas>=2.0.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "rich>=13.0.0",
    "click>=8.1.0",
    "requests>=2.31.0",
    "PyYAML>=6.0",
    "Jinja2>=3.1.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
# BDD testing frameworks
bdd = ["behave>=1.2.6", "pytest-bdd>=7.0.0"]

# Sentence transformer embeddings (alternative to Ollama embeddings)
embeddings = ["sentence-transformers>=2.2.2"]

# MCP server for tool exposure
mcp = ["mcp>=1.0.0"]

# OpenAI provider
openai = ["openai>=1.0.0"]

# Anthropic provider
anthropic = ["anthropic>=0.25.0"]

# LangChain integrations (optional, for future provider chains)
langchain = [
    "langchain>=0.1.0",
    "langchain-community>=0.0.20",
    "langchain-ollama>=0.1.0",
]

# Authentication (optional — only needed when STLC_AUTH_ENABLED=true)
auth = ["PyJWT>=2.8.0", "passlib[bcrypt]>=1.7.4"]

# Development tools
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
    "mypy>=1.8.0",
    "httpx>=0.25.0",
]

# All optional dependencies
all = [
    "stlc-platform[bdd,embeddings,mcp,langchain,auth,dev]",
]

[project.scripts]
stlc = "stlc_platform.cli:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
include = ["stlc_platform*"]

# ── Tool Configuration ───────────────────────────────────────────────────────

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["stlc_platform", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "chromadb.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sentence_transformers.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# chroma_store is migrated code with many None | Collection patterns.
# Full type cleanup is a Stage 1 task.
module = "stlc_platform.core.storage.chroma_store"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::pytest.PytestCollectionWarning",
]
