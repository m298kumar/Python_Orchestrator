# STLC Automation Platform — CI Pipeline
# ========================================
# Runs validation gates and full test suite on every push and PR.
#
# Usage:
#   This workflow runs automatically. To run manually:
#     gh workflow run stlc_ci.yml
#
# The stlc CLI with --ci flag produces JSON output suitable for
# CI artifact archiving and pass/fail decisions.

name: STLC CI Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  backend-tests:
    name: Backend Tests & Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run linting
        run: |
          python -m ruff check stlc_platform/ --select=E,F --ignore=E501,E402

      - name: Run Stage 0-3 unit tests
        run: |
          python -m pytest tests/unit/ -q --tb=short

      - name: Run integration tests
        run: |
          python -m pytest tests/integration/ -q --tb=short

      - name: Run validation gate (Stage 4)
        run: |
          python scripts/validate_stage.py --stage 4

  frontend-tests:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Run tests
        run: npm run test -- --run

      - name: Build frontend
        run: npm run build

  pipeline-smoke:
    name: Pipeline Smoke Test
    runs-on: ubuntu-latest
    needs: backend-tests

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: List registered agents
        run: |
          python -m stlc_platform.cli agents list

      - name: Validate pipeline config
        run: |
          python -c "from stlc_platform.pipeline import load_pipeline; dag = load_pipeline('config/pipelines/full_stlc.yaml'); print(f'Pipeline: {dag.pipeline_name}, Stages: {dag.stage_ids}')"

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: stlc-platform:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
